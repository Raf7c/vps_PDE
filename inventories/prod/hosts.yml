---
# Inventaire générique : les valeurs identifiantes viennent de
# group_vars/all/private.sops.yml (committé chiffré SOPS).
all:
  hosts:
    vps:
      ansible_host: "{{ cloudflare_ssh_hostname }}"
      ansible_user: "{{ vps_admin }}"
      # cloudflared requis sur la machine de contrôle
      ansible_ssh_common_args: >-
        -o ProxyCommand="cloudflared access ssh --hostname %h"
