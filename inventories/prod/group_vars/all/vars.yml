---
# Configuration en clair. Les deux autres fichiers de ce dossier sont
# committés CHIFFRÉS (SOPS/age) et ont chacun leur modèle .example :
# - private.sops.yml : identifiants (utilisateur, clés publiques, hostname)
# - vault.sops.yml   : secrets (token du tunnel, mots de passe, credentials backup)

# ── Comptes ──────────────────────────────────────────────────
# Compte d'administration : wheel (sudo + mot de passe), utilisé uniquement
# par Ansible et comme secours via la console du provider.
# NB : ansible_become_password (= vault_vps_admin_password) est défini AU NIVEAU
# DU PLAY (site.yml, bootstrap play 2), pas ici : au bootstrap play 1 on est
# connecté en compte cloud (sudo NOPASSWD), et le secret n'y est pas encore chargé.
vps_admin: admin

# Comptes cloud du provider, supprimés en fin de bootstrap (play 2, connecté
# en admin) ; le provision refait le contrôle, idempotent.
cloud_users_to_remove:
  - fedora

# ── Système ──────────────────────────────────────────────────
vps_hostname: vps
vps_timezone: Europe/Paris

# ── Paquets (dépôts officiels Fedora UNIQUEMENT) ────────────
base_packages:
  - chrony
  - firewalld
  - audit
  - zsh              # AVANT la création du user (son shell de login)

# dnf5 (Fedora 41+). Pour Fedora ≤ 40 : dnf-automatic / dnf-automatic.timer
dnf_automatic_package: dnf5-plugin-automatic
dnf_automatic_timer: dnf5-automatic.timer

# socle (git/gcc/make/gdb/valgrind) + remote (tmux/neovim)
# + installation sans root (podman/toolbox).
devtools_packages:
  - git
  - gcc
  - make
  - gdb
  - valgrind
  - tmux
  - neovim
  - podman
  - toolbox
  - tar
  - coreutils    # fournit cat, et les utilitaires GNU de base
  - python3
  - python3-pip
  - tree

# ── Backups restic ───────────────────────────────────────────
restic_paths:
  - /home/{{ vps_user }}
restic_excludes:
  - /home/{{ vps_user }}/.cache
  - /home/{{ vps_user }}/.local/share/containers
restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 6
