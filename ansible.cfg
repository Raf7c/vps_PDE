[defaults]
inventory = inventories/prod/hosts.yml
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
# Déchiffrement transparent des group_vars *.sops.yml (via le binaire sops +
# les clés age de ~/.config/sops/age/keys.txt). Plus de fichier de mot de passe.
vars_plugins_enabled = host_group_vars,community.sops.sops

[ssh_connection]
pipelining = True
