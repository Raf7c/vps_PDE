[defaults]
inventory = inventories/prod/hosts.yml
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
# Déchiffrement transparent des group_vars *.sops.yml (via le binaire sops +
# les clés age de ~/.config/sops/age/keys.txt). Plus de fichier de mot de passe.
vars_plugins_enabled = host_group_vars,community.sops.sops

[ssh_connection]
pipelining = True
# IdentityAgent=none : l'agent SSH de macOS ne sait pas signer avec une clé FIDO
# (« agent refused operation ») et, tant qu'il détient la clé, ssh la lui délègue
# sans jamais lire le fichier de poignée. L'agent n'apporte rien ici de toute
# façon : le toucher physique est exigé à chaque signature, rien n'est cachable.
# Les autres options reprennent le défaut d'Ansible, qu'un ssh_args explicite écrase.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o IdentityAgent=none
