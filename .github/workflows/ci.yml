---
name: CI

# Actions pinned to full commit SHAs: a tag is mutable, and the tj-actions
# attack (CVE-2025-30066) repointed every existing tag to a malicious
# commit. Matters most for third-party actions (gitleaks) in a repo that
# handles infrastructure access. Dependabot proposes the bumps.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Un push sur une branche en PR déclenche les deux événements :
# on annule le run devenu obsolète plutôt que de payer les deux.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer l'outillage
        run: pip install ansible-core ansible-lint yamllint

      - name: Installer les collections
        run: ansible-galaxy collection install -r requirements.yml

      # Le lint valide syntaxe et style, pas le déchiffrement (qui exige les
      # clés age, hors périmètre CI). On désactive le vars-plugin sops le temps
      # du lint : aucun *.sops.yml n'est déchiffré.
      - name: ansible-lint (profil production)
        run: ansible-lint
        env:
          ANSIBLE_VARS_ENABLED: host_group_vars

      - name: yamllint
        run: yamllint .

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0   # scanne tout l'historique

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
