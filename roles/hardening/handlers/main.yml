---
- name: Reload firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded

- name: Restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

# auditd refuse systemctl restart (RefuseManualStop) → passage par service(8)
- name: Restart auditd
  ansible.builtin.command: service auditd restart  # noqa: command-instead-of-module
  changed_when: true
