---
- name: Restic (dépôts officiels)
  ansible.builtin.dnf:
    name: restic
    state: present

- name: Répertoire de conf
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    mode: "0700"

- name: Secrets restic (depuis le vault)
  ansible.builtin.template:
    src: restic.env.j2
    dest: /etc/restic/restic.env
    mode: "0600"
  no_log: true

- name: Liste d'exclusions
  ansible.builtin.copy:
    content: "{{ restic_excludes | join('\n') }}\n"
    dest: /etc/restic/excludes.txt
    mode: "0600"

- name: Service + timer de sauvegarde
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - restic-backup.service
    - restic-backup.timer
  notify: Daemon reload (backup)

- name: Timer activé
  ansible.builtin.systemd:
    name: restic-backup.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Initialiser le dépôt restic (si nécessaire)
  ansible.builtin.shell: |
    set -a; . /etc/restic/restic.env; set +a
    restic snapshots >/dev/null 2>&1 || restic init
  args:
    executable: /bin/bash
  register: restic_init
  changed_when: "'created restic repository' in restic_init.stdout"
  no_log: true
