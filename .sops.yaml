---
# Règles de chiffrement SOPS. Chaque fichier *.sops.yml des group_vars est
# chiffré (valeurs uniquement) vers DEUX destinataires age ; n'importe lequel
# déchiffre seul. L'ORDRE compte : sops tente le premier destinataire et propose
# de passer au suivant s'il est absent, donc la clé quotidienne vient en tête.
#   - YubiKey quotidienne
#   - YubiKey de secours, stockée hors du lieu de la première
# Destinataires matériels exclusivement : aucune clé privée n'existe hors des
# puces PIV, donc la perte des deux YubiKeys rend les secrets irrécupérables.
# Rotation des destinataires : éditer cette liste puis `just sops-updatekeys`.
creation_rules:
  - path_regex: inventories/prod/group_vars/all/.*\.sops\.ya?ml$
    key_groups:
      - age:
          - age1yubikey1qww9600wzmnjx3rhy46azr5302jva9ny978jdvcvnz3w3lya8uvcvt6jsxr
          - age1yubikey1qt2838llhrp5q7gv8zyh3dtm4a49v77c4jzxnwm64lmssa6ndmkqcf98xwf
