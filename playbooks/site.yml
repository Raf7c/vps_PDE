---
# État complet du VPS. S'exécute via le tunnel : il suppose un bootstrap déjà fait.

- name: Provisionner le VPS de dev
  hosts: vps
  become: true
  vars:
    # sudo d'admin, depuis les secrets SOPS (chargés par le vars-plugin
    # community.sops avant les tâches). Aucune saisie interactive.
    ansible_become_password: "{{ vault_vps_admin_password }}"

  roles:
    - base
    - cloudflared
    - hardening
    - devtools
    - role: backup
      when: vault_restic_repository | default('') | length > 0
